<style>*{box-sizing:border-box}html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Zineb Abdelmoumen</title>

<style>
/* Layout: one narrow column — black band with the azarchitects mark, name right-aligned, ruled label/value rows, action buttons. Single deliberate look (white card, black band). */
:root {
  --paper: #ffffff;
  --ink: #0b0b0b;
  --band: #000000;
  --on-band: #ffffff;
  --muted: #6a6a6a;
  --font: "Didact Gothic", "Century Gothic", "Avenir Next", "Futura", system-ui, sans-serif;
  --mark-font: "Jost", "Futura", "Century Gothic", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
.card { max-width: 560px; margin: 0 auto; background: var(--paper); }

.band {
  background: var(--band); color: var(--on-band);
  padding-block: 120px 40px;
  padding-left: max(28px, env(safe-area-inset-left, 0px));
  padding-right: max(28px, env(safe-area-inset-right, 0px));
}
.logo { width: 178px; max-width: 46%; height: auto; display: block; }
.logo text { font-family: var(--mark-font); font-weight: 200; }

.body {
  padding-block: 48px 40px;
  padding-left: max(28px, env(safe-area-inset-left, 0px));
  padding-right: max(28px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 44px;
}
.who { text-align: right; display: flex; flex-direction: column; gap: 14px; }
.who h1 { margin: 0; font-weight: 400; font-size: clamp(26px, 7.2vw, 34px); letter-spacing: 0.03em; line-height: 1.15; text-wrap: balance; }
.who p { margin: 0; font-size: 16px; letter-spacing: 0.12em; }

.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
.rows li {
  display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 16px; align-items: baseline;
  padding-block: 22px; border-bottom: 1px solid var(--ink);
}
.label { font-size: 12px; letter-spacing: 0.2em; }
.value { text-align: right; font-size: 17px; line-height: 1.6; overflow-wrap: anywhere; }
.value a { color: inherit; text-decoration: none; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.btn {
  appearance: none; font: inherit; font-size: 15px; letter-spacing: 0.2em;
  min-height: 64px; padding: 0 10px; border: 1px solid var(--ink); border-radius: 0;
  background: var(--paper); color: var(--ink); cursor: pointer; text-decoration: none; text-align: center;
  display: flex; align-items: center; justify-content: center;
}
.btn.primary { grid-column: 1 / -1; background: var(--ink); color: var(--paper); }
.btn:active { opacity: 0.75; }
.btn:focus-visible, .close:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--paper); font-size: 13px; letter-spacing: 0.16em;
  padding: 12px 18px; transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.qr-sheet {
  position: fixed; inset: 0; background: var(--paper); z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.qr-box { width: min(80vw, 380px); max-width: 100%; aspect-ratio: 1; }
.qr-box svg { width: 100%; height: 100%; display: block; }
.qr-foot { width: min(80vw, 380px); max-width: 100%; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.qr-foot .logo { width: 72px; color: var(--ink); }
.qr-foot span { font-size: 18px; letter-spacing: 0.03em; text-align: right; }
.close {
  position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  width: 48px; height: 48px; border: 1px solid var(--ink); border-radius: 50%;
  background: var(--paper); color: var(--ink); font: inherit; font-size: 24px; line-height: 1; cursor: pointer;
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>

<script>
(function () {
  var contact = [
    "Zineb ABDELMOUMEN",
    "architecte, fondatrice — azarchitects",
    "mobile : +212 6 62 17 18 96",
    "bureau : +212 5 22 99 66 80",
    "e-mail : zineb@azarchitectes.com",
    "adresse : angle boulevard ghandi et avenue stendhal, 3e étage, val fleuri, maarif, casablanca, maroc"
  ].join("\n");
  var toast = document.getElementById("toast"), t;
  function say(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(t);
    t = setTimeout(function () { toast.classList.remove("show"); }, 2200);
  }
  function fallbackCopy() {
    var ta = document.createElement("textarea");
    ta.value = contact; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    say(ok ? "contact copié" : "copie impossible, sélectionnez le texte");
  }
  document.getElementById("copy").addEventListener("click", function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(contact).then(function () { say("contact copié"); }, fallbackCopy);
    } else { fallbackCopy(); }
  });
  var sheet = document.getElementById("qrsheet");
  document.getElementById("showqr").addEventListener("click", function () {
    sheet.hidden = false; document.getElementById("closeqr").focus();
  });
  function close() { sheet.hidden = true; document.getElementById("showqr").focus(); }
  document.getElementById("closeqr").addEventListener("click", close);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !sheet.hidden) close(); });
})();
</script>
